# Supabase local development configuration.
#
# `project_id` is the local container namespace, not the hosted project ref.
project_id = "event-camera-app"

[api]
enabled = true
port = 54321
# `private` is deliberately absent. Its helper functions are SECURITY DEFINER
# and must never be callable over PostgREST.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[storage]
enabled = true
# Sized for future video. Per-bucket limits in the storage migration are
# tighter and are what actually applies.
file_size_limit = "500MiB"

[auth]
enabled = true
site_url = "eventcamera://"
additional_redirect_urls = [
  "eventcamera://auth/callback",
  "http://localhost:8081",
  "http://localhost:8081/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Passwordless only. No password sign-in surface exists in the app.
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
# Six-digit OTP rather than a magic link: it survives the email-client
# link-prefetch problem and works when the mail app cannot open the app.
otp_length = 6
otp_expiry = 3600

# Both templates are overridden because the stock ones carry only
# {{ .ConfirmationURL }} and no {{ .Token }}. Without a code in the email,
# verifyOtp can never succeed.
#
# A first-time address goes through `confirmation` (sign-up) and a returning one
# through `magic_link`, so BOTH must carry the code or sign-in works only for
# one of the two.
#
# These apply to the LOCAL stack only. The hosted project's templates are edited
# in the dashboard — see docs/auth-setup.md.

[auth.email.template.confirmation]
subject = "Your sign-in code"
content_path = "./supabase/templates/otp.html"

[auth.email.template.magic_link]
subject = "Your sign-in code"
content_path = "./supabase/templates/otp.html"

[auth.sms]
enable_signup = false

[analytics]
enabled = false

[functions.delete-account]
verify_jwt = true

[local_smtp]
# Local mail catcher, so OTP emails are readable during development without
# consuming the hosted project's email rate limit.
# (Replaces the deprecated [inbucket] section.)
enabled = true
port = 54324
