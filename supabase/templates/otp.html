<!--
  Email template carrying the six-digit code.

  The stock Supabase templates contain only {{ .ConfirmationURL }}. With a
  link-only email, `verifyOtp` can never succeed — the user has no code to type,
  which presents as a sign-in screen that accepts an address and then goes
  nowhere.

  {{ .Token }} is the part that matters. The link is deliberately omitted: mail
  clients that pre-fetch URLs can consume a single-use token before the user
  ever taps it, and in a native app a link means leaving for a mail client and
  hoping the deep link survives the round trip.
-->
<h2>Your sign-in code</h2>

<p>Enter this code to finish signing in:</p>

<p style="font-size: 32px; letter-spacing: 8px; font-weight: 600; margin: 24px 0;">
  {{ .Token }}
</p>

<p>It expires in one hour. If you did not request it, you can ignore this email.</p>
