<!doctype html>
<meta charset="utf-8">
<title>Disposable filter tuner</title>
<style>
  :root {
    --bg: #14151a; --panel: #1c1e25; --line: #2c2f39;
    --ink: #e8e9ee; --dim: #9aa0b0; --accent: #ffb26b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 13px/1.5 ui-sans-serif, -apple-system, system-ui, sans-serif;
    display: grid; grid-template-columns: 340px 1fr; height: 100vh; overflow: hidden;
  }
  #panel { border-right: 1px solid var(--line); overflow-y: auto; padding: 16px; }
  #stage { display: flex; flex-direction: column; align-items: center; justify-content: center;
           padding: 20px; gap: 12px; overflow: hidden; }
  canvas { max-width: 100%; max-height: calc(100vh - 130px); border-radius: 4px;
           box-shadow: 0 8px 40px rgba(0,0,0,.5); }
  h1 { font-size: 14px; margin: 0 0 4px; letter-spacing: .02em; }
  .note { color: var(--dim); font-size: 11.5px; margin: 0 0 16px; }
  fieldset { border: 1px solid var(--line); border-radius: 6px; margin: 0 0 12px; padding: 10px 12px 12px; }
  legend { color: var(--accent); font-size: 11px; text-transform: uppercase; letter-spacing: .09em; padding: 0 5px; }
  .row { display: grid; grid-template-columns: 1fr 56px; gap: 8px; align-items: center; margin-bottom: 7px; }
  .row label { color: var(--dim); font-size: 12px; }
  .row output { font-variant-numeric: tabular-nums; text-align: right; font-size: 11.5px; }
  .row input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 0; }
  .row.colour input[type=color] { width: 56px; height: 22px; padding: 0; border: 1px solid var(--line);
                                  border-radius: 4px; background: none; cursor: pointer; }
  .changed label { color: var(--accent); }
  #stamp {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 5px; padding: 6px 9px; font: inherit; font-size: 12px; width: 100%;
    font-variant-numeric: tabular-nums;
  }
  select, button {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 5px; padding: 6px 9px; font: inherit; font-size: 12px; width: 100%;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #201400; border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  .controls { display: grid; gap: 7px; margin-bottom: 14px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  #status { color: var(--dim); font-size: 11.5px; min-height: 17px; text-align: center; }
  #status.err { color: #ff8080; }
  #status.ok { color: #7ddc93; }
  kbd { background: var(--panel); border: 1px solid var(--line); border-radius: 3px;
        padding: 1px 4px; font-size: 11px; }
  #drop { position: fixed; inset: 0 0 0 340px; display: none; align-items: center;
          justify-content: center; background: rgba(20,21,26,.9); color: var(--accent);
          border: 2px dashed var(--accent); font-size: 15px; z-index: 10; }
  body.dragging #drop { display: flex; }
</style>

<div id="panel">
  <h1>Disposable filter tuner</h1>
  <p class="note">
    Preview only — <strong>nothing is written to <code>src/</code></strong> until you press Save.
    Hold <kbd>space</kbd> to see the original. Drop a photo anywhere to test it.
  </p>

  <div class="controls">
    <select id="image"></select>
    <div class="pair">
      <button id="pick">Upload a photo…</button>
      <button id="keep" hidden>Keep for next time</button>
    </div>
    <input id="file" type="file" accept="image/*" hidden>
    <input id="stamp" type="text" placeholder="date stamp, e.g. '99 12 29">
    <div class="pair">
      <select id="seed"></select>
      <select id="size">
        <option value="0">Source size</option>
        <option value="1400">1400px</option>
        <option value="2400">2400px</option>
        <option value="4032">4032px (export)</option>
      </select>
    </div>
    <div class="pair">
      <button id="reset">Reset all</button>
      <button id="save" class="primary" disabled>Save</button>
    </div>
  </div>

  <div id="sliders"></div>
</div>

<div id="stage">
  <canvas id="canvas"></canvas>
  <div id="drop">Drop a photo anywhere</div>
  <div id="status">Loading CanvasKit…</div>
</div>

<!-- CanvasKit ships as a classic UMD script, not an ES module: loaded with a
     plain tag so it can attach window.CanvasKitInit before the module runs. -->
<script src="/canvaskit.js"></script>
<script type="module">
import { setCanvasKit } from '/skia-browser-shim.js';
import { DISPOSABLE_PRESET } from '/mod/disposable-preset.js';
import { buildDisposableRecipe } from '/mod/disposable-recipe.js';
import { recordDisposablePicture } from '/mod/disposable-paint.js';

const status = document.getElementById('status');
const say = (text, kind = '') => { status.textContent = text; status.className = kind; };

/*
 * Slider ranges. Chosen to bracket each value generously in both directions —
 * a tuner whose range stops at the current value cannot tell you the current
 * value is wrong.
 */
const RANGES = {
  'tone.exposure': [-0.2, 0.3, 0.005],
  'tone.contrast': [0, 0.6, 0.005],
  'tone.highlights': [-0.4, 0.2, 0.005],
  'tone.shadows': [-0.4, 0.2, 0.005],
  'tone.blacks': [-0.3, 0.2, 0.005],
  'tone.whites': [-0.2, 0.3, 0.005],

  'colour.saturation': [-0.3, 0.5, 0.005],
  'colour.temperature': [-0.08, 0.12, 0.002],
  'colour.tint': [-0.06, 0.06, 0.001],
  'colour.warmHighlights': [0, 0.3, 0.005],
  'colour.coolShadows': [0, 0.2, 0.005],
  'colour.blueDensity': [0, 0.4, 0.005],
  'colour.greenControl': [0, 0.35, 0.005],
  'colour.blueRichness': [-0.2, 0.4, 0.005],
  'colour.greenRestraint': [-0.3, 0.2, 0.005],

  'grain.intensity.base': [0, 0.1, 0.001],
  'grain.cells': [300, 2600, 50],
  'grain.contrast': [0.6, 2.4, 0.05],
  'grain.shadowBias': [0, 1, 0.02],

  'softness.blurPx': [0, 2.5, 0.05],

  'vignette.strength.base': [0, 0.4, 0.005],
  'vignette.radius.base': [0.2, 1, 0.01],
  'vignette.softness': [0.1, 1.2, 0.02],

  'dust.probability': [0, 1, 0.05],
  'dust.opacity.base': [0, 0.8, 0.01],
  'dust.density.base': [6, 70, 1],
  'dust.size.base': [0.4, 6, 0.1],
  'dust.darkRatio': [0, 1, 0.02],

  'scratches.probability': [0, 1, 0.05],
  'scratches.opacity.base': [0, 0.2, 0.005],
  'scratches.width.base': [0.001, 0.02, 0.0005],

  'lightLeak.probability': [0, 1, 0.05],
  'lightLeak.opacity.base': [0, 0.3, 0.005],
  'lightLeak.spread.base': [0.1, 1, 0.01],

  'dateStamp.size': [0.02, 0.14, 0.002],
  'dateStamp.marginX': [0, 0.25, 0.005],
  'dateStamp.marginY': [0, 0.25, 0.005],
  'dateStamp.opacity': [0, 1, 0.02],
  'dateStamp.softness': [0, 0.1, 0.002],
  'dateStamp.bloomRadius': [0, 0.4, 0.005],
  'dateStamp.bloomOpacity': [0, 1.2, 0.02],
  'dateStamp.bleedRadius': [0, 1, 0.01],
  'dateStamp.bleedOpacity': [0, 0.7, 0.01],
  'dateStamp.unevenness': [0, 0.6, 0.01],
};

/** Values that are colours rather than numbers, shown as swatches. */
const COLOURS = ['dateStamp.core', 'dateStamp.glow'];

const GROUP_LABELS = {
  tone: 'Tone', colour: 'Colour', grain: 'Grain', softness: 'Softness',
  vignette: 'Vignette', dust: 'Dust', scratches: 'Scratches', lightLeak: 'Light leak',
  dateStamp: 'Date stamp',
};

const read = (object, dotted) => dotted.split('.').reduce((node, key) => node?.[key], object);
const clone = (value) => JSON.parse(JSON.stringify(value));
const overrides = {};

// ── Sliders ───────────────────────────────────────────────────────────

const container = document.getElementById('sliders');
const inputs = new Map();

for (const group of Object.keys(GROUP_LABELS)) {
  const paths = Object.keys(RANGES).filter((path) => path.startsWith(`${group}.`));
  if (!paths.length) continue;

  const set = document.createElement('fieldset');
  set.innerHTML = `<legend>${GROUP_LABELS[group]}</legend>`;

  for (const path of paths) {
    const [rawMin, max, step] = RANGES[path];
    const initial = read(DISPOSABLE_PRESET, path);
    const name = path.slice(group.length + 1).replace(/\.base$/, '');

    /*
     * A range input snaps its value to `min + n * step`, silently. If the
     * preset's value is not on that grid the slider quietly moves it, and the
     * tuner opens showing a render that is *not* the preset — which is the one
     * thing a tuner must never do. Shifting `min` so the preset value lands
     * exactly on the grid costs a fraction of a step at the far end and
     * guarantees the starting point is honest.
     */
    const min = initial - Math.round((initial - rawMin) / step) * step;

    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML =
      `<label>${name}</label><output></output>` +
      `<input type="range" min="${min}" max="${max}" step="${step}" value="${initial}">`;

    const slider = row.querySelector('input');
    const readout = row.querySelector('output');
    const paint = () => {
      readout.textContent = Number(slider.value).toFixed(step < 0.01 ? 4 : 3);
      // Epsilon, not equality: both sides are floats off the same grid.
      row.classList.toggle('changed', Math.abs(Number(slider.value) - initial) > step / 1000);
    };
    paint();

    slider.addEventListener('input', () => {
      const value = Number(slider.value);
      if (Math.abs(value - initial) <= step / 1000) delete overrides[path];
      else overrides[path] = value;
      paint();
      document.getElementById('save').disabled = Object.keys(overrides).length === 0;
      render();
    });

    inputs.set(path, { slider, initial, paint });
    set.appendChild(row);
  }

  for (const path of COLOURS.filter((entry) => entry.startsWith(`${group}.`))) {
    const initial = read(DISPOSABLE_PRESET, path);
    const row = document.createElement('div');
    row.className = 'row colour';
    row.innerHTML =
      `<label>${path.slice(group.length + 1)}</label>` +
      `<input type="color" value="${initial}">`;
    const picker = row.querySelector('input');
    const paint = () => row.classList.toggle('changed', picker.value !== initial);
    picker.addEventListener('input', () => {
      if (picker.value === initial) delete overrides[path];
      else overrides[path] = picker.value;
      paint();
      document.getElementById('save').disabled = Object.keys(overrides).length === 0;
      render();
    });
    inputs.set(path, { slider: picker, initial, paint });
    set.appendChild(row);
  }

  container.appendChild(set);
}

// ── Rendering ─────────────────────────────────────────────────────────

let CK = null;
let surface = null;
let image = null;
let showOriginal = false;

const canvas = document.getElementById('canvas');

function presetWithOverrides() {
  const preset = clone(DISPOSABLE_PRESET);
  for (const [path, value] of Object.entries(overrides)) {
    const keys = path.split('.');
    const last = keys.pop();
    keys.reduce((node, key) => node[key], preset)[last] = value;
  }
  return preset;
}

function render() {
  if (!CK || !image) return;

  const forced = Number(document.getElementById('size').value);
  const scale = forced ? forced / image.width() : 1;
  const width = Math.round(image.width() * scale);
  const height = Math.round(image.height() * scale);

  if (canvas.width !== width || canvas.height !== height) {
    canvas.width = width;
    canvas.height = height;
    surface?.delete();
    surface = CK.MakeWebGLCanvasSurface(canvas);
    if (!surface) return say('WebGL surface unavailable in this browser.', 'err');
  }

  const drawing = surface.getCanvas();
  const seed = document.getElementById('seed').value;

  if (showOriginal) {
    drawing.clear(CK.TRANSPARENT);
    const plain = new CK.Paint();
    plain.setAntiAlias(true);
    drawing.drawImageRect(
      image,
      CK.XYWHRect(0, 0, image.width(), image.height()),
      CK.XYWHRect(0, 0, width, height),
      plain,
    );
  } else {
    // The real modules, the real shader, the real paint — the only thing this
    // tool substitutes is which Skia binding they talk to. Going through
    // `recordDisposablePicture` specifically, because that is the call the
    // gallery makes, so the tuner previews the app's own code path.
    const preset = presetWithOverrides();
    const recipe = buildDisposableRecipe(seed, preset);
    const stamp = document.getElementById('stamp').value.trim();
    drawing.clear(CK.TRANSPARENT);
    drawing.drawPicture(
      recordDisposablePicture(image, recipe, {
        width,
        height,
        // The canvas is measured in real pixels here, as an export is.
        devicePixelRatio: 1,
        dateStamp: stamp ? { text: stamp, style: preset.dateStamp } : undefined,
      }),
    );
  }

  surface.flush();

  const count = Object.keys(overrides).length;
  say(
    `${width}x${height}` +
      (showOriginal ? '  ·  showing original' : '') +
      (count ? `  ·  ${count} value${count === 1 ? '' : 's'} changed, unsaved` : ''),
    count ? 'ok' : '',
  );
}

/*
 * Decodes through the browser before falling back to Skia's own codecs.
 *
 * Two reasons that order, both of which matter most for exactly the photos you
 * would want to test against — the ones off your phone. The browser applies
 * the EXIF orientation tag; Skia does not, so a portrait photo decoded the
 * other way round renders on its side. And the browser knows whatever formats
 * it knows, which on Safari includes HEIC, where Skia has no codec at all.
 */
async function decode(blob, label) {
  try {
    const bitmap = await createImageBitmap(blob, { imageOrientation: 'from-image' });
    // A 48-megapixel photo is 190MB of RGBA. Capped for memory only; the
    // render size is chosen separately, so this does not change what you see.
    const cap = 5000;
    const scale = Math.min(1, cap / Math.max(bitmap.width, bitmap.height));
    const width = Math.round(bitmap.width * scale);
    const height = Math.round(bitmap.height * scale);

    const scratch = document.createElement('canvas');
    scratch.width = width;
    scratch.height = height;
    const context = scratch.getContext('2d', { willReadFrequently: true });
    context.drawImage(bitmap, 0, 0, width, height);
    bitmap.close();

    const pixels = context.getImageData(0, 0, width, height).data;
    const decoded = CK.MakeImage(
      {
        width,
        height,
        colorType: CK.ColorType.RGBA_8888,
        alphaType: CK.AlphaType.Unpremul,
        colorSpace: CK.ColorSpace.SRGB,
      },
      new Uint8Array(pixels.buffer),
      width * 4,
    );
    if (decoded) return decoded;
  } catch {
    // Browser could not decode it; Skia may still manage.
  }

  const decoded = CK.MakeImageFromEncoded(new Uint8Array(await blob.arrayBuffer()));
  if (decoded) return decoded;

  throw new Error(
    /heic|heif/i.test(label)
      ? `${label} is HEIC, which this browser cannot decode. Safari can, or export it as JPEG.`
      : `could not decode ${label}`,
  );
}

async function show(blob, label) {
  try {
    const next = await decode(blob, label);
    image?.delete();
    image = next;
    // Force a surface rebuild at the new aspect ratio.
    canvas.width = 0;
    render();
  } catch (error) {
    say(String(error.message ?? error), 'err');
  }
}

async function loadImage(relative) {
  const response = await fetch(`/img?path=${encodeURIComponent(relative)}`);
  await show(await response.blob(), relative);
}

// ── Controls ──────────────────────────────────────────────────────────

const seedPicker = document.getElementById('seed');
for (let i = 1; i <= 8; i += 1) {
  seedPicker.append(new Option(`Variation ${i}`, `tuner-seed-${i}`));
}
seedPicker.addEventListener('change', render);
const stampInput = document.getElementById('stamp');
stampInput.value = "'99 12 29";
stampInput.addEventListener('input', render);
document.getElementById('size').addEventListener('change', render);

document.getElementById('reset').addEventListener('click', () => {
  for (const [path, { slider, initial, paint }] of inputs) {
    slider.value = initial;
    void path;
    delete overrides[path];
    paint();
  }
  document.getElementById('save').disabled = true;
  render();
});

document.getElementById('save').addEventListener('click', async () => {
  const button = document.getElementById('save');
  button.disabled = true;
  const response = await fetch('/api/save', {
    method: 'POST',
    body: JSON.stringify(overrides),
  });
  const body = await response.json();
  if (!response.ok) {
    say(body.error, 'err');
    button.disabled = false;
    return;
  }
  // The file now holds these values, so they become the new baseline and
  // nothing is outstanding.
  for (const [path, entry] of inputs) {
    if (overrides[path] !== undefined) entry.initial = overrides[path];
    delete overrides[path];
    entry.paint();
  }
  say(`Saved ${body.applied.length} value${body.applied.length === 1 ? '' : 's'} to disposable-preset.ts`, 'ok');
});

addEventListener('keydown', (event) => {
  if (event.code === 'Space' && !showOriginal) {
    event.preventDefault();
    showOriginal = true;
    render();
  }
});
addEventListener('keyup', (event) => {
  if (event.code === 'Space') {
    showOriginal = false;
    render();
  }
});

// ── Boot ──────────────────────────────────────────────────────────────

CK = await window.CanvasKitInit({ locateFile: () => '/canvaskit.wasm' });
setCanvasKit(CK);

const picker = document.getElementById('image');
for (const file of await (await fetch('/api/images')).json()) {
  picker.append(new Option(file.split('/').pop(), file));
}
/** Photos added this session, kept in memory under an `upload:` picker value. */
const uploads = new Map();
let lastUpload = null;

picker.addEventListener('change', () => {
  const entry = uploads.get(picker.value);
  document.getElementById('keep').hidden = !entry;
  lastUpload = entry ?? null;
  if (entry) show(entry.file, entry.file.name);
  else loadImage(picker.value);
});

async function addUpload(file) {
  if (!file) return;
  const value = `upload:${file.name}:${Date.now()}`;
  uploads.set(value, { file });
  picker.append(new Option(`${file.name}  (uploaded)`, value));
  picker.value = value;
  lastUpload = uploads.get(value);
  document.getElementById('keep').hidden = false;
  await show(file, file.name);
}

const fileInput = document.getElementById('file');
document.getElementById('pick').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  addUpload(fileInput.files[0]);
  // Cleared so re-picking the same file fires `change` again.
  fileInput.value = '';
});

let dragDepth = 0;
addEventListener('dragenter', (event) => {
  event.preventDefault();
  dragDepth += 1;
  document.body.classList.add('dragging');
});
addEventListener('dragover', (event) => event.preventDefault());
addEventListener('dragleave', () => {
  dragDepth -= 1;
  if (dragDepth <= 0) document.body.classList.remove('dragging');
});
addEventListener('drop', (event) => {
  event.preventDefault();
  dragDepth = 0;
  document.body.classList.remove('dragging');
  addUpload(event.dataTransfer.files[0]);
});

document.getElementById('keep').addEventListener('click', async () => {
  if (!lastUpload) return;
  const response = await fetch(`/api/keep?name=${encodeURIComponent(lastUpload.file.name)}`, {
    method: 'POST',
    body: lastUpload.file,
  });
  const body = await response.json();
  say(response.ok ? `Kept at ${body.path}` : body.error, response.ok ? 'ok' : 'err');
});

const preferred = [...picker.options].find((option) => option.value.includes('christian'));
if (preferred) picker.value = preferred.value;
await loadImage(picker.value);
</script>
